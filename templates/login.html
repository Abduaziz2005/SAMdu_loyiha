{% extends "base.html" %}
{% block title %}Kirish{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-mark">S</div>
      <div>
        <div class="auth-logo-title">S_TATU</div>
        <div class="auth-logo-sub">SAMdu Platform</div>
      </div>
    </div>

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab {% if tab != 'register' %}active{% endif %}" onclick="switchTab('login')">Kirish</button>
      <button class="auth-tab {% if tab == 'register' %}active{% endif %}" onclick="switchTab('register')">Ro'yxat</button>
    </div>

    {% if error %}
    <div class="alert alert-danger">⚠️ {{ error }}</div>
    {% endif %}

    <!-- LOGIN FORM -->
    <form id="loginForm" class="auth-form {% if tab == 'register' %}hidden{% endif %}"
          action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Login (username)</label>
        <input class="form-input" type="text" name="username"
               placeholder="admin yoki student1" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Parol</label>
        <div class="input-pass-wrap">
          <input class="form-input" type="password" name="password"
                 placeholder="••••••••" required id="loginPass" autocomplete="current-password">
          <button type="button" class="pass-toggle" onclick="togglePass('loginPass')">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Kirish →</button>
      <div class="auth-hint">
        <span>Demo:</span>
        <code>admin / admin123</code> yoki
        <code>student1 / 1234</code>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="auth-form {% if tab != 'register' %}hidden{% endif %}"
          action="{{ url_for('register') }}" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">To'liq ism</label>
          <input class="form-input" type="text" name="full_name" placeholder="Ali Karimov" required>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" name="username" placeholder="ali_karimov" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Parol</label>
          <div class="input-pass-wrap">
            <input class="form-input" type="password" name="password" id="regPass"
                   placeholder="••••••••" required autocomplete="new-password">
            <button type="button" class="pass-toggle" onclick="togglePass('regPass')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Kurs</label>
          <select class="form-select" name="course">
            <option value="1">1-kurs</option>
            <option value="2">2-kurs</option>
            <option value="3">3-kurs</option>
            <option value="4">4-kurs</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Fakultet</label>
          <select class="form-select" name="faculty">
            <option value="KTIF">KTIF</option>
            <option value="EIQ">EIQ</option>
            <option value="MMF">MMF</option>
            <option value="ITF">ITF</option>
            <option value="HF">HF</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Mutaxassislik</label>
          <input class="form-input" type="text" name="specialty" placeholder="Dasturlash">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Ro'yxatdan o'tish →</button>
    </form>

  </div>
</div>

<script>
function switchTab(tab) {
  const loginForm = document.getElementById('loginForm');
  const regForm   = document.getElementById('registerForm');
  document.querySelectorAll('.auth-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register'));
  });
  loginForm.classList.toggle('hidden', tab !== 'login');
  regForm.classList.toggle('hidden', tab !== 'register');
}
function togglePass(id) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
